name: Website v3 release QA

on:
  pull_request:
    branches:
      - site/v3-institutional-face
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-release-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify visitor-intent navigation contracts
        run: |
          node scripts/check_primary_navigation_intents.mjs
          node scripts/check_institutional_component_architecture.mjs

      - name: Build production application
        run: npm run build

      - name: Install pinned browser QA harness
        run: |
          # Do not mutate app dependencies after building. In particular, an
          # unlocked npm install here can upgrade Next and invalidate .next.
          next_version_before="$(node -p 'require("next/package.json").version')"
          mkdir -p .qa-tools
          npm install --prefix .qa-tools --no-save --package-lock=false playwright@1.55.0
          ln -s ../.qa-tools/node_modules/playwright node_modules/playwright
          test "$(node -p 'require("next/package.json").version')" = "$next_version_before"
          node .qa-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Run Website v3 release QA
        run: node scripts/qa_v3_release.mjs

      - name: Upload Website v3 release QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-qa
          path: qa-artifacts/v3-release
          if-no-files-found: warn
          retention-days: 14
