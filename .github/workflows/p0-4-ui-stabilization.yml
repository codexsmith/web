name: P0.4 UI stabilization

on:
  push:
    branches:
      - agent/p0-4-ui-stabilization-20260813

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-4-ui-stabilization-20260813
          fetch-depth: 0

      - name: Write stabilization tooling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          scripts = Path("scripts")
          scripts.mkdir(exist_ok=True)

          scripts.joinpath("opacity_purge.py").write_text(
              textwrap.dedent(r'''
              from __future__ import annotations

              import re
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              SRC = ROOT / "src"
              SOURCE_EXTENSIONS = {".js", ".jsx", ".ts", ".tsx", ".mdx"}

              MUTED_RE = re.compile(r"(?<![\w-])text-muted-foreground(?:/\d+)?\b")
              STANDARD_RE = re.compile(r"(?<![\w-])text-foreground/(\d+)\b")
              INVERSE_RE = re.compile(r"(?<![\w-])text-primary-foreground/(\d+)\b")


              def normalize_text_utilities(content: str) -> str:
                  content = MUTED_RE.sub("text-foreground-muted", content)
                  content = INVERSE_RE.sub(
                      lambda match: (
                          "text-primary-foreground-secondary"
                          if int(match.group(1)) >= 70
                          else "text-primary-foreground-muted"
                      ),
                      content,
                  )
                  return STANDARD_RE.sub(
                      lambda match: (
                          "text-foreground-secondary"
                          if int(match.group(1)) >= 80
                          else "text-foreground-muted"
                      ),
                      content,
                  )


              def main() -> None:
                  changed = []
                  for path in sorted(SRC.rglob("*")):
                      if not path.is_file() or path.suffix not in SOURCE_EXTENSIONS:
                          continue
                      before = path.read_text(encoding="utf-8")
                      after = normalize_text_utilities(before)
                      if after == before:
                          continue
                      path.write_text(after, encoding="utf-8")
                      changed.append(path.relative_to(ROOT).as_posix())

                  print(f"Normalized text utilities in {len(changed)} files")
                  for path in changed:
                      print(f"  {path}")


              if __name__ == "__main__":
                  main()
              ''').lstrip(),
              encoding="utf-8",
          )

          scripts.joinpath("replace_email.py").write_text(
              textwrap.dedent(r'''
              from __future__ import annotations

              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              SRC = ROOT / "src"
              CANONICAL_EMAIL = "contact@boundaryfirstlabs.com"
              LEGACY_EMAILS = ("contact@boundaryfirst.com", "nsc319@gmail.com")
              SOURCE_EXTENSIONS = {".js", ".jsx", ".ts", ".tsx", ".json", ".mdx"}


              def main() -> None:
                  changed = []
                  for path in sorted(SRC.rglob("*")):
                      if not path.is_file() or path.suffix not in SOURCE_EXTENSIONS:
                          continue
                      before = path.read_text(encoding="utf-8")
                      after = before
                      for legacy_email in LEGACY_EMAILS:
                          after = after.replace(legacy_email, CANONICAL_EMAIL)
                      if after == before:
                          continue
                      path.write_text(after, encoding="utf-8")
                      changed.append(path.relative_to(ROOT).as_posix())

                  print(f"Canonicalized public contact email in {len(changed)} files")
                  for path in changed:
                      print(f"  {path}")


              if __name__ == "__main__":
                  main()
              ''').lstrip(),
              encoding="utf-8",
          )

          scripts.joinpath("check_ui_stabilization.py").write_text(
              textwrap.dedent(r'''
              from __future__ import annotations

              import re
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              SRC = ROOT / "src"
              SOURCE_EXTENSIONS = {".js", ".jsx", ".ts", ".tsx", ".mdx"}
              LEGACY_EMAILS = ("contact@boundaryfirst.com", "nsc319@gmail.com")
              CANONICAL_EMAIL = "contact@boundaryfirstlabs.com"


              def fail(errors: list[str], path: Path, reason: str) -> None:
                  errors.append(f"{path.relative_to(ROOT).as_posix()}: {reason}")


              def main() -> None:
                  errors: list[str] = []
                  canonical_contact_count = 0

                  for path in sorted(SRC.rglob("*")):
                      if not path.is_file() or path.suffix not in SOURCE_EXTENSIONS | {".json"}:
                          continue
                      content = path.read_text(encoding="utf-8")
                      canonical_contact_count += content.count(CANONICAL_EMAIL)

                      if path.suffix in SOURCE_EXTENSIONS:
                          if "text-muted-foreground" in content:
                              fail(errors, path, "legacy muted text token remains")
                          if re.search(r"\btext-(?:primary-)?foreground/", content):
                              fail(errors, path, "raw foreground alpha text utility remains")
                          if re.search(r"<main\b[^>]*\boverflow-x-hidden\b", content, re.DOTALL):
                              fail(errors, path, "top-level main still masks horizontal overflow")

                      for legacy_email in LEGACY_EMAILS:
                          if legacy_email in content:
                              fail(errors, path, f"legacy public contact remains: {legacy_email}")

                  globals_css = (SRC / "app" / "globals.css").read_text(encoding="utf-8")
                  if "overflow-x-hidden" in globals_css:
                      fail(errors, SRC / "app" / "globals.css", "global overflow-x mask remains")

                  site = (SRC / "lib" / "site.ts").read_text(encoding="utf-8")
                  if 'DEFAULT_SITE_ORIGIN = "https://boundaryfirstlabs.com"' not in site:
                      fail(errors, SRC / "lib" / "site.ts", "canonical site origin is not boundaryfirstlabs.com")
                  if f'PUBLIC_CONTACT_EMAIL = "{CANONICAL_EMAIL}"' not in site:
                      fail(errors, SRC / "lib" / "site.ts", "canonical public contact constant is missing")

                  header = (SRC / "components" / "site-header.tsx").read_text(encoding="utf-8")
                  for required in ('variant="compact"', "h-12 w-12", "lg:flex", "lg:hidden"):
                      if required not in header:
                          fail(errors, SRC / "components" / "site-header.tsx", f"header invariant missing: {required}")

                  if canonical_contact_count == 0:
                      errors.append("src: canonical public contact email is not exposed anywhere")

                  if errors:
                      print("P0.4 UI stabilization check failed:")
                      for error in errors:
                          print(f"  - {error}")
                      raise SystemExit(1)

                  print("P0.4 UI stabilization invariants pass")
                  print(f"Canonical public contact references: {canonical_contact_count}")


              if __name__ == "__main__":
                  main()
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Normalize legacy UI tokens and contact identity
        shell: bash
        run: |
          python scripts/opacity_purge.py
          python scripts/replace_email.py
          python - <<'PY'
          import json
          from pathlib import Path

          atlas = Path("src/components/public-interface/AtlasListExperience.tsx")
          before = atlas.read_text(encoding="utf-8")
          after = before.replace(
              'className="min-h-screen overflow-x-hidden bg-background text-foreground"',
              'className="min-h-screen bg-background text-foreground"',
          )
          if after == before and "<main" in before and "overflow-x-hidden" in before:
              raise SystemExit("Atlas root overflow mask was present but did not match the expected stabilization target")
          atlas.write_text(after, encoding="utf-8")

          site_path = Path("src/lib/site.ts")
          site = site_path.read_text(encoding="utf-8")
          anchor = 'export const DEFAULT_SITE_ORIGIN = "https://boundaryfirstlabs.com";\n'
          if "PUBLIC_CONTACT_EMAIL" not in site:
              if anchor not in site:
                  raise SystemExit("Canonical site origin anchor was not found")
              site = site.replace(
                  anchor,
                  anchor
                  + '\nexport const PUBLIC_CONTACT_EMAIL = "contact@boundaryfirstlabs.com";\n'
                  + 'export const PUBLIC_CONTACT_MAILTO = `mailto:${PUBLIC_CONTACT_EMAIL}`;\n',
                  1,
              )
              site_path.write_text(site, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["ui:normalize"] = "python scripts/opacity_purge.py && python scripts/replace_email.py"
          scripts["ui:check"] = "python scripts/check_ui_stabilization.py"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/check_ui_stabilization.py
          git diff --check

      - name: Commit stabilized source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No stabilization changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/opacity_purge.py scripts/replace_email.py scripts/check_ui_stabilization.py src
          git commit -m "fix: complete P0.4 UI stabilization pass"
          git push origin HEAD:agent/p0-4-ui-stabilization-20260813

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify content and UI invariants
        run: |
          npm run content:check
          npm run ui:check
          npm run lint
          npm run test:ui -- --run
          npm run build
