name: P0.4 UI stabilization

on:
  push:
    branches:
      - agent/p0-4-ui-stabilization-20260813

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-4-ui-stabilization-20260813
          fetch-depth: 0

      - name: Normalize P0.4 source
        shell: bash
        run: |
          git show origin/main:src/app/map/page.tsx > src/app/map/page.tsx
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/map/page.tsx")
          before = path.read_text(encoding="utf-8")
          target = 'className="min-h-screen overflow-x-hidden bg-background text-foreground"'
          replacement = 'className="min-h-screen bg-background text-foreground"'
          if target not in before:
              raise SystemExit("Expected map root overflow mask was not found in main")
          path.write_text(before.replace(target, replacement, 1), encoding="utf-8")
          PY
          python scripts/opacity_purge.py
          python scripts/replace_email.py
          python scripts/check_ui_stabilization.py
          git diff --check

      - name: Commit normalized map source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/map/page.tsx
          git commit -m "fix: restore focused map stabilization diff"
          git push origin HEAD:agent/p0-4-ui-stabilization-20260813

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify P0.4 and build
        shell: bash
        run: |
          npm run content:check
          npm run ui:check
          npm run lint
          npm run build

      - name: Run full UI suite
        run: npm run test:ui -- --run
