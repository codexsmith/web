name: P6 process circuit QA

on:
  push:
    branches:
      - agent/p6-bfux-process-circuit
  pull_request:
    branches:
      - agent/p5-semantic-content-artifacts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-process-circuit-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install QA browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run process circuit browser QA
        run: |
          mkdir -p qa-artifacts/p6-process-circuit
          setsid npm run start -- -p 3226 > qa-artifacts/p6-process-circuit/server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3226/about/how-we-work?view=process' >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat qa-artifacts/p6-process-circuit/server.log
            exit 1
          fi

          P6_QA_BASE=http://127.0.0.1:3226 node scripts/qa_p6_process_circuit.mjs
          P6_QA_BASE=http://127.0.0.1:3226 node scripts/qa_p6_traversal_shelf.mjs

      - name: Upload process circuit QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-process-circuit-qa
          path: qa-artifacts/p6-process-circuit
          if-no-files-found: warn
          retention-days: 14
