name: Review gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit refreshed dependency lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh dependency lock"
          git push origin HEAD:agent/dependency-prune

      - name: Runtime diagnostic
        continue-on-error: true
        run: npm run runtime:check

      - name: Lint diagnostic
        continue-on-error: true
        run: npm run lint
