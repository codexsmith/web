name: Review gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check v2 architecture contracts
        run: npm run contracts:check

      - name: Check publication portfolio contracts
        run: node scripts/check_publication_contracts.mjs

      - name: Check industrial UI contracts
        run: node scripts/check_industrial_ui_contracts.mjs

      - name: Check Apparatus hardening contracts
        run: node scripts/check_apparatus_hardening.mjs

      - name: Check landing review contracts
        run: node scripts/check_landing_review_contracts.mjs

      - name: Check third-layer detail contracts
        run: node scripts/check_p4_detail_surfaces.mjs

      - name: Check Corpus Forge workbench contracts
        run: node scripts/check_p4_corpus_forge.mjs

      - name: Check Boundary First UX conformance contracts
        run: node scripts/check_p4_boundary_first_ux.mjs

      - name: Check Closure-Driven delivery contracts
        run: node scripts/check_p4_closure_driven.mjs

      - name: Check Weather research-testbed contracts
        run: node scripts/check_p4_weather_testbed.mjs

      - name: Check Schemathematics formal-program contracts
        run: node scripts/check_p4_schemathematics.mjs

      - name: Check Law provenance-research contracts
        run: node scripts/check_p4_law_research.mjs

      - name: Check Chess practitioner decision-board contracts
        run: node scripts/check_p4_chess_practitioner.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Exercise Corpus Forge production workbench
        run: node scripts/check_p4_corpus_forge_runtime.mjs

      - name: Exercise Boundary First UX production instrument
        run: node scripts/check_p4_boundary_first_ux_runtime.mjs

      - name: Exercise Closure-Driven production instrument
        run: node scripts/check_p4_closure_driven_runtime.mjs

      - name: Exercise Weather production research testbed
        run: node scripts/check_p4_weather_testbed_runtime.mjs

      - name: Exercise Schemathematics production formal program
        run: node scripts/check_p4_schemathematics_runtime.mjs

      - name: Exercise Law production provenance research instrument
        run: node scripts/check_p4_law_research_runtime.mjs

      - name: Exercise Chess production practitioner decision board
        run: node scripts/check_p4_chess_practitioner_runtime.mjs

      - name: Exercise v2 production routes
        run: npm run runtime:check
