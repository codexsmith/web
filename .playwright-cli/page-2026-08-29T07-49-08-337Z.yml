              - generic [ref=e145]: Planned public-interest project
            - paragraph [ref=e146]: A bounded public-interest direction for making Augusta-area civic and historical infrastructure more inspectable through source-grounded maps, timelines, datasets, relationship models, and public analysis.
            - generic [ref=e147]:
              - paragraph [ref=e148]: "The project begins from a practical premise: software can be the machinery behind a public artifact without the artifact itself needing to be a commercial software product. Data collection, normalization, provenance, mapping, comparison, and relationship modeling can produce a useful public dataset, map, timeline, report, or interactive analysis."
              - paragraph [ref=e149]: The strongest historical standing is CityWatch, delivered inside Augusta-Richmond County IT. That work demonstrated a citizen-facing representation joining project, spending, infrastructure status, timeline, media, and geographic context. It is relevant experience, not evidence of a current municipal partnership.
              - paragraph [ref=e150]: The modern project should begin smaller than 'map the city.' The appropriate first unit is one bounded civic or historical infrastructure question with inspectable sources, explicit uncertainty, a representation/consequence map, and one public artifact that can be corrected when better evidence arrives.
              - paragraph [ref=e151]: Potential questions include how public spending and projects connect across place and time, how maintenance and replacement obligations become visible, how historic infrastructure decisions propagate into present conditions, and how public records can be made easier to inspect without overstating what the records prove.
